name: 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 单元测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装框架
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

  pytest-plugin:
    name: pytest 插件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装框架与 pytest
        run: pip install -e ".[pytest]"

      - name: 运行插件测试
        run: pytest pytest_tests -v

  smoke:
    name: 端到端冒烟（示例流程）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装框架（含可选依赖）
        run: pip install -e ".[schema,html]"

      - name: 启动演示服务
        run: |
          python examples/mock_server.py &
          sleep 2

      - name: 执行示例用例（并生成报告）
        run: |
          atf run examples/cases/user_flow.yaml -e examples/config.yaml \
            --html reports/atf-report.html --allure allure-results
          atf run examples/cases/hooks_demo.yaml -e examples/config.yaml
          atf run examples/cases/assertions_demo.yaml -e examples/config.yaml
          atf run examples/cases/schema_demo.yaml -e examples/config.yaml
          atf run examples/cases/xpath_demo.yaml -e examples/config.yaml
          test -f reports/atf-report.html
          test -f allure-results/environment.properties

      - name: 验证用例生成
        run: |
          atf gen examples/openapi.json -o /tmp/generated
          test -f /tmp/generated/generated_cases.yaml
          atf gen examples/demo.har -o /tmp/har_out
          test -f /tmp/har_out/har_cases.yaml
          atf gen --curl examples/curl_command.txt -o /tmp/curl_out
          test -f /tmp/curl_out/curl_cases.yaml

      - name: 数据库断言冒烟
        run: |
          python examples/prepare_demo_data.py
          atf run examples/cases/db_check.yaml

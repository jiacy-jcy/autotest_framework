[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 注意：发布 PyPI 前需确认包名可用，届时改为正式品牌名
name = "atf"
version = "0.5.0"
description = "ATF 智测 —— AI 加持、中文友好的接口自动化测试框架"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pytest = ["pytest>=7.0"]
excel = ["openpyxl>=3.0"]
mysql = ["PyMySQL>=1.0"]
postgresql = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7.0", "openpyxl>=3.0"]

[project.scripts]
atf = "atf.cli:main"

# 安装后 pytest 自动加载 ATF 插件，收集 YAML 用例
[project.entry-points.pytest11]
atf = "atf.pytest_plugin"

[tool.setuptools.packages.find]
include = ["atf*"]

[tool.pytest.ini_options]
testpaths = ["tests", "pytest_tests"]

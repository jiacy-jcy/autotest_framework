# 故意失败的用例：演示 --ai-analyze（失败分类）与 --ai-fix（修补建议）
# 运行：atf run examples/analyze/fail_demo.yaml -e examples/config.yaml --ai-analyze --ai-fix
config:
  name: 演示-故意失败
  base_url: ${env.base_url}

teststeps:
  - name: 登录（期望值写错）
    request:
      method: POST
      url: /api/login
      json:
        username: ${env.username}
        password: ${env.password}
    validate:
      - eq: [$.code, 999]        # 接口实际返回 0，这里故意写错

# 完整流程示例：登录 → 携带令牌查询 → 修改用户名
config:
  name: 用户模块接口流程
  base_url: ${env.base_url}
  tags: [smoke, user]
  mask: [password]           # 报告中对该字段打码

teststeps:
  - name: 登录获取令牌
    request:
      method: POST
      url: /api/login
      json:
        username: ${env.username}
        password: ${env.password}
    extract:
      token: $.data.token
      user_id: $.data.user_id
    validate:
      - eq: [status_code, 200]
      - eq: [$.code, 0]
      - contains: [$.msg, 成功]

  - name: 携带令牌查询用户详情
    request:
      method: GET
      url: /api/users/${user_id}
      headers:
        Authorization: Bearer ${token}
    validate:
      - eq: [$.data.name, 张三]
      - 等于: [$.data.role, admin]        # 中文比较符演示
      - 正则匹配: [$.msg, ^查询]

  - name: 修改用户姓名
    request:
      method: PUT
      url: /api/users/${user_id}
      headers:
        Authorization: Bearer ${token}
      json:
        name: 张三丰
    validate:
      - eq: [$.code, 0]
      - eq: [$.data.name, 张三丰]

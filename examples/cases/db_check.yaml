# 数据库断言示例：数据文件由 python examples/prepare_demo_data.py 生成（在 examples/ 下）
config:
  name: 数据库断言示例
  tags: [db]

teststeps:
  - name: 查询用户状态
    db:
      url: sqlite:///../demo.db       # 相对用例所在目录（../ 即 examples/）；绝对路径写作 sqlite:///C:/path/demo.db
      query: "SELECT id, name, status FROM users WHERE id = :uid"
      args:
        uid: 1
    extract:
      user_name: $[0].name
      user_status: $[0].status
    validate:
      - eq: ["${user_name}", 张三]
      - eq: ["${user_status}", active]
